<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35444b"/>
    </marker>
  </defs>
  <rect width="760" height="230" fill="white"/>
  <g font-family="sans-serif" fill="#263238" font-size="14">
    <text x="380" y="25" text-anchor="middle" font-size="17" font-weight="bold">One shared graph, two checking filters</text>
    <g fill="none" stroke="#35444b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 100 110 H 201"/>
      <path d="M 249 94 Q 308 48 368 94"/>
      <path d="M 368 127 Q 308 171 249 127"/>
    </g>
    <circle cx="75" cy="110" r="25" fill="#f2f3f3" stroke="#35444b"/>
    <circle cx="225" cy="110" r="25" fill="#e8f2f0" stroke="#35444b"/>
    <circle cx="393" cy="110" r="25" fill="#e8f2f0" stroke="#35444b"/>
    <text x="75" y="115" text-anchor="middle">R</text>
    <text x="225" y="115" text-anchor="middle">A</text>
    <text x="393" y="115" text-anchor="middle">B</text>
    <text x="150" y="99" text-anchor="middle">quiet</text>
    <text x="308" y="60" text-anchor="middle">check</text>
    <text x="308" y="174" text-anchor="middle">quiet</text>
    <text x="75" y="155" text-anchor="middle">turn 0</text>
    <text x="225" y="155" text-anchor="middle">turn 1</text>
    <text x="393" y="155" text-anchor="middle">turn 0</text>
    <text x="465" y="80">View p = 0: retain all three edges.</text>
    <text x="465" y="104">Cyclic vertices: {A, B}, not R.</text>
    <text x="465" y="139">View p = 1: remove quiet turn-0 edges.</text>
    <text x="465" y="163">Cyclic vertices: empty.</text>
    <text x="380" y="212" text-anchor="middle">A and B alternate turns; only A gives check.</text>
  </g>
</svg>
