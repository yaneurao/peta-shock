<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#303030"/></marker>
    <marker id="blocked" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a12436"/></marker>
  </defs>
  <rect width="980" height="330" fill="white"/>
  <g font-family="Noto Sans CJK JP, sans-serif" fill="#202020" text-anchor="middle">
    <text x="240" y="27" font-size="19">pの視点：負値なので延長を好む</text>
    <text x="740" y="27" font-size="19">qの視点：正値なので短縮を好む</text>
    <g fill="none" stroke="#303030" stroke-width="2.2" marker-end="url(#arrow)">
      <path d="M140 105Q240 55 338 105"/><path d="M340 135Q240 185 142 135"/>
      <path d="M132 157L211 231"/><path d="M348 157L269 231"/>
      <path d="M640 105Q740 55 838 105"/>
      <path d="M632 157L711 231"/><path d="M848 157L769 231"/>
    </g>
    <path d="M840 135Q740 185 642 135" fill="none" stroke="#a12436" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#blocked)"/>
    <g fill="#eef4f1" stroke="#303030" stroke-width="2">
      <circle cx="110" cy="122" r="42"/><circle cx="370" cy="122" r="42"/>
      <circle cx="610" cy="122" r="42"/><circle cx="870" cy="122" r="42"/>
    </g>
    <g font-size="18">
      <text x="110" y="116">A（p番）</text>
      <text x="110" y="140">Rp = inf</text>
      <text x="370" y="116">B（q番）</text>
      <text x="370" y="140">Rp = inf</text>
      <text x="610" y="116">A（p番）</text>
      <text x="610" y="140">Rq = 2</text>
      <text x="870" y="116">B（q番）</text>
      <text x="870" y="140">Rq = 1</text>
    </g>
    <g fill="#fff" stroke="#303030" stroke-width="2">
      <rect x="160" y="235" width="160" height="45" rx="3"/><rect x="660" y="235" width="160" height="45" rx="3"/>
    </g>
    <text x="240" y="264" font-size="18">leaf：pに−85</text><text x="740" y="264" font-size="18">leaf：qに+85</text>
    <text x="240" y="309" font-size="16">pはA→Bを選べるが、qはleafへ出られる</text>
    <text x="740" y="201" font-size="15" fill="#a12436">B→Aはqの正値保証を壊すので除外</text>
    <text x="740" y="309" font-size="16">同じ局面でも、視点を替えてrankをコピーしない</text>
  </g>
</svg>
