<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#344952"/></marker>
  </defs>
  <rect width="760" height="268" fill="white"/>
  <g font-family="serif" fill="#263b44" font-size="16">
    <text x="380" y="25" text-anchor="middle" font-size="20">A quiet self move may reset the rank</text>
    <path d="M175 108 Q280 42 385 108" fill="none" stroke="#344952" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M385 148 Q280 214 175 148" fill="none" stroke="#344952" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="145" cy="128" r="38" fill="#edf0f2" stroke="#344952"/>
    <circle cx="415" cy="128" r="38" fill="#e7f1ee" stroke="#344952"/>
    <text x="145" y="124" text-anchor="middle">U (q)</text>
    <text x="145" y="145" text-anchor="middle">rank 1</text>
    <text x="415" y="124" text-anchor="middle">V (p)</text>
    <text x="415" y="145" text-anchor="middle">rank 0</text>
    <text x="280" y="65" text-anchor="middle">opponent move: 1 to 0</text>
    <text x="280" y="210" text-anchor="middle">quiet self move: 0 to 1</text>
    <path d="M453 128 H533" fill="none" stroke="#344952" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="538" y="109" width="64" height="38" fill="#f4f0e8" stroke="#344952"/>
    <text x="570" y="134" text-anchor="middle">leaf -a</text>
    <text x="520" y="181">If V to U gives check,</text>
    <text x="520" y="202">exclude that edge.</text>
    <text x="380" y="247" text-anchor="middle">a is nonnegative; quiet repetition has payoff 0, which is at least -a.</text>
  </g>
</svg>
