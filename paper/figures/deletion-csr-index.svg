<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330">
  <defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#344952"/></marker></defs>
  <rect width="840" height="330" fill="white"/>
  <g font-family="serif" font-size="18" fill="#263b44" text-anchor="middle">
    <text x="240" y="28">Distinct IDs for parallel edges</text>
    <text x="670" y="28">CSR incoming rows</text>
    <g fill="none" stroke="#344952" stroke-width="2" marker-end="url(#arrow)">
      <path d="M115 136 Q195 56 275 136"/>
      <path d="M115 164 Q195 244 275 164"/>
