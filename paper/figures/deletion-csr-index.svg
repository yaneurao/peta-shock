    <circle cx="305" cy="150" r="32" fill="white" stroke="#344952"/>
    <circle cx="457" cy="150" r="32" fill="#dbeadf" stroke="#344952"/>
    <text x="85" y="146">a</text><text x="85" y="165" font-size="14">AND</text>
    <text x="305" y="146">b</text><text x="305" y="165" font-size="14">OR</text>
    <text x="457" y="156">z</text>
