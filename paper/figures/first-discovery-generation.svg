<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35444b"/>
    </marker>
  </defs>
  <rect width="760" height="210" fill="white"/>
  <g font-family="sans-serif" fill="#263238" text-anchor="middle" font-size="14">
    <text x="380" y="25" font-size="17" font-weight="bold">Generate a forward row only on first discovery</text>
    <rect x="28" y="63" width="210" height="56" rx="6" fill="#eef2f4" stroke="#35444b"/>
    <rect x="290" y="63" width="180" height="56" rx="6" fill="#e8f2f0" stroke="#35444b"/>
    <rect x="527" y="63" width="205" height="56" rx="6" fill="#f4eee9" stroke="#35444b"/>
    <text x="133" y="86">A root or an incoming edge</text>
    <text x="133" y="106">asks to discover v</text>
    <text x="380" y="96">seen[v] ?</text>
    <text x="630" y="86">false: mark seen, generate row</text>
    <text x="630" y="106">and push one frame</text>
    <path d="M 240 91 H 284" fill="none" stroke="#35444b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 473 91 H 521" fill="none" stroke="#35444b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 380 122 V 157" fill="none" stroke="#35444b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="177">true: return unchanged; no row generation</text>
    <text x="380" y="201">Repeated roots, self-loops and rejoining edges cannot spend the same credit twice.</text>
  </g>
</svg>
