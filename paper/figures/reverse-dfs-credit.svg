<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35444b"/>
    </marker>
  </defs>
  <rect width="760" height="210" fill="white"/>
  <g font-family="sans-serif" fill="#263238" text-anchor="middle" font-size="14">
    <text x="380" y="27" font-weight="bold" font-size="17">The second DFS never replenishes vertex credits</text>
    <rect x="22" y="64" width="180" height="79" rx="6" fill="#eef2f4" stroke="#35444b"/>
    <rect x="288" y="64" width="180" height="79" rx="6" fill="#e8f2f0" stroke="#35444b"/>
    <rect x="554" y="64" width="184" height="79" rx="6" fill="#f4eee9" stroke="#35444b"/>
    <text x="112" y="92">Unassigned vertex v</text>
    <text x="112" y="119">credit: 1 + indegree(v)</text>
    <text x="378" y="92">Assigned and pending</text>
    <text x="378" y="119">the same credit</text>
    <text x="646" y="92">Popped once</text>
    <text x="646" y="119">pop + parent-list scan</text>
    <g stroke="#35444b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 205 103 H 282"/>
      <path d="M 471 103 H 548"/>
    </g>
    <text x="245" y="80">push</text>
    <text x="510" y="80">consume</text>
    <text x="380" y="176">A later edge or component root cannot assign v again.</text>
    <text x="380" y="197">Total consumed credits = N + sum of parent-list lengths.</text>
  </g>
</svg>
