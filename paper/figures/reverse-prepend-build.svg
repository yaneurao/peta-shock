<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35444b"/>
    </marker>
  </defs>
  <rect width="760" height="250" fill="white"/>
  <g font-family="sans-serif" fill="#263238">
    <text x="380" y="25" text-anchor="middle" font-size="16" font-weight="bold">Prepend once per internal edge, then reverse each row once</text>
    <g fill="none" stroke="#35444b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 105 94 Q 210 51 313 94"/>
      <path d="M 105 124 Q 210 166 313 124"/>
      <path d="M 80 142 V 189"/>
    </g>
    <circle cx="80" cy="110" r="31" fill="#e8f2f0" stroke="#35444b" stroke-width="2"/>
    <circle cx="340" cy="110" r="31" fill="#edf0f7" stroke="#35444b" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="80" y="116" font-size="17">P</text><text x="340" y="116" font-size="17">C</text>
      <text x="210" y="69" font-size="13">e0</text><text x="210" y="159" font-size="13">e1</text>
    </g>
    <rect x="45" y="194" width="70" height="32" rx="3" fill="#f3f5f6" stroke="#35444b"/>
    <text x="80" y="215" text-anchor="middle" font-size="13">leaf</text>
    <text x="107" y="179" font-size="13">e2</text>
    <g font-size="14">
      <text x="425" y="69">Input order: [e0, e1, e2]</text>
      <text x="425" y="102">Raw row(C): [e1, e0]</text>
      <text x="425" y="135">Final row(C): [e0, e1]</text>
      <text x="425" y="168">Two IDs remain two entries.</text>
      <text x="425" y="201">The leaf edge is not registered.</text>
    </g>
  </g>
</svg>
