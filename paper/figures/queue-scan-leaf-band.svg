<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35444b"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="white"/>
  <g font-family="sans-serif" fill="#263238" text-anchor="middle">
    <text x="360" y="23" font-size="16" font-weight="bold">Keep the AND counter across thresholds; record only once</text>
    <circle cx="73" cy="119" r="30" fill="#edf0f7" stroke="#35444b" stroke-width="2"/>
    <text x="73" y="114" font-size="17">A</text><text x="73" y="134" font-size="12">q (AND)</text>
    <path d="M 97 100 L 205 70" fill="none" stroke="#35444b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 97 138 L 205 167" fill="none" stroke="#35444b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="210" y="48" width="74" height="44" rx="3" fill="#f3f5f6" stroke="#35444b" stroke-width="2"/>
    <rect x="210" y="145" width="74" height="44" rx="3" fill="#f3f5f6" stroke="#35444b" stroke-width="2"/>
    <text x="247" y="76" font-size="17">+30</text><text x="247" y="173" font-size="17">+20</text>
    <text x="162" y="222" font-size="12">Leaf payoffs are from p's perspective.</text>
    <text x="162" y="241" font-size="12">q chooses; p can guarantee 20.</text>
    <text x="372" y="62" font-size="12">threshold</text><text x="466" y="62" font-size="12">left[A]</text>
    <text x="565" y="62" font-size="12">confirmed?</text><text x="664" y="62" font-size="12">record</text>
    <text x="372" y="98" font-size="16">40</text><text x="466" y="98" font-size="16">2</text>
    <text x="565" y="98" font-size="16">no</text><text x="664" y="98" font-size="16">0</text>
    <text x="372" y="137" font-size="16">30</text><text x="466" y="137" font-size="16">1</text>
    <text x="565" y="137" font-size="16">no</text><text x="664" y="137" font-size="16">0</text>
    <text x="372" y="176" font-size="16">20</text><text x="466" y="176" font-size="16">0</text>
    <text x="565" y="176" font-size="16">yes</text><text x="664" y="176" font-size="16" fill="#176a50" font-weight="bold">20</text>
    <text x="372" y="215" font-size="16">10</text><text x="466" y="215" font-size="16">0</text>
    <text x="565" y="215" font-size="16">yes</text><text x="664" y="215" font-size="16" fill="#176a50" font-weight="bold">20</text>
    <text x="525" y="244" font-size="12">10 is optional and has no new leaf notifications.</text>
  </g>
</svg>
