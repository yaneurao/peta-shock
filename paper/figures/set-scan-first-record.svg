<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35444b"/>
    </marker>
  </defs>
  <rect width="720" height="240" fill="white"/>
  <g font-family="sans-serif" fill="#263238" text-anchor="middle">
    <text x="150" y="27" font-size="16" font-weight="bold">One vertex, one legal move</text>
    <circle cx="73" cy="112" r="31" fill="#e8f2f0" stroke="#35444b" stroke-width="2"/>
    <text x="73" y="109" font-size="17">A</text>
    <text x="73" y="127" font-size="12">p to move</text>
    <path d="M 105 112 H 188" fill="none" stroke="#35444b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="192" y="85" width="78" height="54" rx="3" fill="#eef0f7" stroke="#35444b" stroke-width="2"/>
    <text x="231" y="108" font-size="14">leaf</text>
    <text x="231" y="128" font-size="18">+20</text>
    <text x="150" y="181" font-size="13">Payoff is from p's perspective.</text>
    <text x="150" y="202" font-size="13">No other moves or cycles.</text>
  </g>
  <path d="M 303 45 V 215" stroke="#b7c4c8"/>
  <g font-family="sans-serif" fill="#263238" text-anchor="middle">
    <text x="509" y="27" font-size="16" font-weight="bold">Same set and labels carried forward</text>
    <text x="372" y="64" font-size="13">threshold</text>
    <text x="511" y="64" font-size="13">A confirmed?</text>
    <text x="651" y="64" font-size="13">stored value</text>
    <text x="372" y="99" font-size="16">32000</text>
    <text x="511" y="99" font-size="16">no</text>
    <text x="651" y="99" font-size="16">0</text>
    <text x="372" y="137" font-size="16">20</text>
    <text x="511" y="137" font-size="16">yes</text>
    <text x="651" y="137" font-size="16" fill="#176a50" font-weight="bold">20 (first)</text>
    <text x="372" y="175" font-size="16">10</text>
    <text x="511" y="175" font-size="16">yes</text>
    <text x="651" y="175" font-size="16" fill="#176a50" font-weight="bold">20 (kept)</text>
    <text x="509" y="213" font-size="12">10 is an optional extra level; the sparse scan may omit it.</text>
  </g>
</svg>
