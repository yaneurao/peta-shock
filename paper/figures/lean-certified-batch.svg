<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
  </defs>
  <rect width="680" height="240" fill="white"/>
  <g fill="none" stroke="#263238" stroke-width="2">
    <path d="M 126 82 Q 200 16 274 82" marker-end="url(#arrow)"/>
    <path d="M 274 118 Q 200 184 126 118" marker-end="url(#arrow)"/>
    <circle cx="100" cy="100" r="32" fill="#e8f4f0"/>
    <circle cx="300" cy="100" r="32" fill="#e8f4f0"/>
    <path d="M 366 28 L 366 204" stroke="#aab8be" stroke-width="1"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#263238" text-anchor="middle">
    <text x="100" y="96">A (p)</text><text x="100" y="115">rank 1</text>
    <text x="300" y="96">B (q)</text><text x="300" y="115">rank 1</text>
    <text x="200" y="35">non-check</text><text x="200" y="184">check</text>
    <text x="200" y="213">Add {A, B} as one safe batch</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#263238">
    <text x="392" y="48" font-weight="bold">One simultaneous proof step</text>
    <text x="392" y="81">W = {}  --&gt;  W = {A, B}</text>
    <text x="392" y="112">Both vertices receive the same rank.</text>
    <text x="392" y="143">FIFO insertion: [A, B]</text>
    <text x="392" y="174">Then pop and notify incoming edges.</text>
    <text x="392" y="205">No independent singleton admission.</text>
  </g>
  <text x="340" y="235" font-family="sans-serif" font-size="11" fill="#455a64" text-anchor="middle">Abstract graph; not a concrete legal shogi position. Fixed player: p.</text>
</svg>
