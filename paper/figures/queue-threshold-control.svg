<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35444b"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="white"/>
  <rect x="256" y="48" width="365" height="132" fill="none" stroke="#78928c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-family="sans-serif" fill="#263238" text-anchor="middle">
    <text x="360" y="22" font-size="16" font-weight="bold">Local confirmation must return to the ordinary queue</text>
    <text x="438" y="68" font-size="12">checking-cycle core</text>
    <circle cx="85" cy="116" r="29" fill="#f3f5f6" stroke="#35444b" stroke-width="2"/>
    <text x="85" y="112" font-size="17">R</text><text x="85" y="131" font-size="12">p</text>
    <circle cx="314" cy="116" r="29" fill="#e8f2f0" stroke="#35444b" stroke-width="2"/>
    <text x="314" y="112" font-size="17">A</text><text x="314" y="131" font-size="12">q</text>
    <circle cx="560" cy="116" r="29" fill="#e8f2f0" stroke="#35444b" stroke-width="2"/>
    <text x="560" y="112" font-size="17">B</text><text x="560" y="131" font-size="12">p</text>
    <path d="M 116 116 H 282" fill="none" stroke="#35444b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="195" y="105" font-size="12">non-check</text>
    <path d="M 340 99 Q 438 61 534 99" fill="none" stroke="#35444b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="438" y="91" font-size="12">check</text>
    <path d="M 534 133 Q 438 173 340 133" fill="none" stroke="#35444b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="438" y="172" font-size="12">non-check</text>
    <text x="360" y="205" font-size="13">No leaves. Each node has exactly the outgoing move drawn above.</text>
    <text x="48" y="238" font-size="13" text-anchor="start">1. Local result: {A, B}; ordinary queue: [A, B]. R is not confirmed yet.</text>
    <text x="48" y="262" font-size="13" text-anchor="start">2. Pop A: notify R and B. R becomes confirmed; queue becomes [B, R].</text>
    <text x="48" y="286" font-size="13" text-anchor="start">3. Drain B and R. All three are confirmed; the next local result is empty.</text>
  </g>
</svg>
